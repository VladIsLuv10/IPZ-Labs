
{% extends "base.html" %}

{% block title %}Оформлення замовлення | HookMe{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto px-4 py-12">

    <h1 class="text-3xl font-bold text-[#183d32] mb-4">
        Оформлення замовлення
    </h1>

    <p class="text-gray-600 mb-8">
        Заповніть контактні дані для оформлення замовлення.
    </p>

    {% if error %}
    <div class="bg-red-100 text-red-800 p-4 rounded-lg mb-6">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST"
          action="{{ url_for('checkout') }}"
          class="bg-white rounded-xl shadow p-8 space-y-5">

        <div>
            <label class="block mb-2 font-medium">
                Ваше ім'я *
            </label>
            <input type="text" name="customer_name" required
                   maxlength="100"
                   value="{{ request.form.get('customer_name', '') }}"
                   class="w-full border border-gray-300 rounded-lg p-3">
        </div>

        <div>
            <label class="block mb-2 font-medium">
                Телефон *
            </label>
            <input type="tel" name="phone" required
                   maxlength="30"
                   value="{{ request.form.get('phone', '') }}"
                   class="w-full border border-gray-300 rounded-lg p-3"
                   placeholder="+380...">
        </div>

        <div>
            <label class="block mb-2 font-medium">
                Email
            </label>
            <input type="email" name="email"
                   maxlength="254"
                   value="{{ request.form.get('email', '') }}"
                   class="w-full border border-gray-300 rounded-lg p-3">
        </div>

        <div>
            <label class="block mb-2 font-medium">
                Адреса доставки *
            </label>
            <textarea name="address" required maxlength="300"
                      rows="3"
                      class="w-full border border-gray-300 rounded-lg p-3"
                      placeholder="Місто, відділення пошти або адреса">{{ request.form.get('address', '') }}</textarea>
        </div>

        <div>
            <label class="block mb-2 font-medium">
                Коментар до замовлення
            </label>
            <textarea name="comment" maxlength="1000"
                      rows="3"
                      class="w-full border border-gray-300 rounded-lg p-3">{{ request.form.get('comment', '') }}</textarea>
        </div>

        <button type="submit"
                class="bg-[#183d32] text-white px-8 py-3 rounded-lg hover:bg-[#285747] transition">
            Підтвердити замовлення
        </button>
    </form>

</section>
{% endblock %}
