
{% extends "base.html" %}

{% block title %}Замовлення оформлено | HookMe{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 py-16 text-center">

    <div class="bg-white rounded-xl shadow p-10">

        <div class="text-5xl mb-5">✅</div>

        <h1 class="text-3xl font-bold text-[#183d32] mb-4">
            Дякуємо за замовлення!
        </h1>

        <p class="text-gray-600 mb-3">
            Ваше замовлення №{{ order_id }} створено.
        </p>

        <p class="text-gray-600 mb-8">
            Ми зв'яжемося з вами для підтвердження.
        </p>

        <a href="{{ url_for('catalog') }}"
           class="inline-block bg-[#183d32] text-white px-8 py-3 rounded-lg hover:bg-[#285747]">
            Повернутися до каталогу
        </a>

    </div>

</section>
{% endblock %}
